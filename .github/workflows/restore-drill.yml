name: Restore drill

# Once a month, prove production's backups restore (Constitution VII.7):
# restore the latest point in time to a temporary instance, verify it,
# record how long it took, delete it. A failure pages like any incident.
# Runs in the "production-drill" GitHub environment, whose role can restore
# and delete only drill instances.

on:
  schedule:
    - cron: "30 22 3 * *" # 04:00 IST on the 3rd
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    environment: production-drill
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DRILL_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Restore, verify, delete
        env:
          NAME: morbeez-prod
          CLUSTER: morbeez-prod
          SOURCE_DB: morbeez-prod
          SUBNETS: ${{ vars.ECS_SUBNETS }}
          SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
          DB_SECURITY_GROUP: ${{ vars.DB_SECURITY_GROUP }}
        run: bash infrastructure/scripts/restore-drill.sh
