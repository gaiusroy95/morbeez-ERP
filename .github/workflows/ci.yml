name: CI

# Runs on every PR and on push to main. None of this is bypassable by a
# merge override (Constitution VI.3, VII.1) — a red pipeline blocks merge.

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: morbeez
          POSTGRES_PASSWORD: morbeez_ci
          POSTGRES_DB: morbeez
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U morbeez"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://morbeez:morbeez_ci@localhost:5432/morbeez
      APP_DATABASE_URL: postgres://morbeez_app:morbeez_app_ci@localhost:5432/morbeez
      APP_DB_PASSWORD: morbeez_app_ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_secret_not_for_real_use
      FIELD_ENCRYPTION_KEY: ci_test_encryption_key_not_real
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The migration role owns the database but is no superuser — exactly
      # RDS's master user. A superuser is exempt from RLS, which hid two
      # launch blockers (migrations writing defaults under FORCE RLS; the
      # login lookup finding no one). Test fixtures keep the superuser.
      - name: Create the migration owner (non-superuser, as on RDS)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Untrusted, so it needs a superuser here; RDS's master user may create it.
          CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
          CREATE ROLE migrator LOGIN PASSWORD 'migrator_ci' NOSUPERUSER CREATEROLE NOBYPASSRLS;
          ALTER DATABASE morbeez OWNER TO migrator;
          SQL
      - name: Run migrations as the migration owner
        env:
          DATABASE_URL: postgres://migrator:migrator_ci@localhost:5432/morbeez
        run: pnpm --filter @morbeez/backend migrate:up
      - run: pnpm run test

  test-tenant-isolation:
    # Real Postgres, real RLS, connecting as the same restricted role the
    # production app uses — this is what actually proves tenant isolation,
    # not just documents the intent (see test/integration).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: morbeez
          POSTGRES_PASSWORD: morbeez_ci
          POSTGRES_DB: morbeez
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U morbeez"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://morbeez:morbeez_ci@localhost:5432/morbeez
      APP_DATABASE_URL: postgres://morbeez_app:morbeez_app_ci@localhost:5432/morbeez
      APP_DB_PASSWORD: morbeez_app_ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The migration role owns the database but is no superuser — exactly
      # RDS's master user. A superuser is exempt from RLS, which hid two
      # launch blockers (migrations writing defaults under FORCE RLS; the
      # login lookup finding no one). Test fixtures keep the superuser.
      - name: Create the migration owner (non-superuser, as on RDS)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Untrusted, so it needs a superuser here; RDS's master user may create it.
          CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
          CREATE ROLE migrator LOGIN PASSWORD 'migrator_ci' NOSUPERUSER CREATEROLE NOBYPASSRLS;
          ALTER DATABASE morbeez OWNER TO migrator;
          SQL
      - name: Run migrations as the migration owner
        env:
          DATABASE_URL: postgres://migrator:migrator_ci@localhost:5432/morbeez
        run: pnpm --filter @morbeez/backend migrate:up
      - run: pnpm --filter @morbeez/backend test:integration

  migration-reversibility:
    # A migration that can't roll back isn't backward-compatible
    # (Constitution III.6) — verified here, not assumed.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: morbeez
          POSTGRES_PASSWORD: morbeez_ci
          POSTGRES_DB: morbeez
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U morbeez"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://morbeez:morbeez_ci@localhost:5432/morbeez
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The migration role owns the database but is no superuser — exactly
      # RDS's master user. A superuser is exempt from RLS, which hid two
      # launch blockers (migrations writing defaults under FORCE RLS; the
      # login lookup finding no one). Test fixtures keep the superuser.
      - name: Create the migration owner (non-superuser, as on RDS)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Untrusted, so it needs a superuser here; RDS's master user may create it.
          CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
          CREATE ROLE migrator LOGIN PASSWORD 'migrator_ci' NOSUPERUSER CREATEROLE NOBYPASSRLS;
          ALTER DATABASE morbeez OWNER TO migrator;
          SQL
      # Every migration down and back up — migrate:down with no count only
      # undoes the newest one, which left the rest untested in CI.
      - name: Migrate up, all the way down, and up again (as the migration owner)
        env:
          DATABASE_URL: postgres://migrator:migrator_ci@localhost:5432/morbeez
          APP_DB_PASSWORD: morbeez_app_ci
        run: |
          pnpm --filter @morbeez/backend migrate:up
          pnpm --filter @morbeez/backend migrate:down 10000
          pnpm --filter @morbeez/backend migrate:up

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          target: runtime
          push: false
      - name: Build migration image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          target: migrate
          push: false
      - name: Build owner-app image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/owner-app/Dockerfile
          push: false

  security-scan:
    # Known-vulnerable dependencies block merge above the agreed severity
    # threshold (Constitution V.8).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
