name: CD

# Every green commit on main goes to staging, then — once a reviewer approves
# the GitHub "production" environment — the same images go to production
# (Constitution VII.1: no path to production that bypasses the pipeline).
# A manual run with an earlier commit SHA redeploys that release: the
# rollback path. Images are immutable and tagged with the commit.
#
# Each environment's GitHub settings hold its variables: AWS_ACCOUNT_ID,
# AWS_DEPLOY_ROLE_ARN, ECS_SUBNETS, ECS_SECURITY_GROUP, API_URL, WEB_URL
# (all from `terraform output`). No AWS keys are stored anywhere: jobs assume
# the deploy role through OIDC (Constitution V.3).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Commit SHA to (re)deploy — its images must already be in ECR
        required: true

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_sha }}

jobs:
  build:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - name: Build the three images once
        run: |
          docker buildx build -f apps/backend/Dockerfile --target runtime -t api:$TAG --load .
          docker buildx build -f apps/backend/Dockerfile --target migrate -t migrate:$TAG --load .
          docker buildx build -f apps/owner-app/Dockerfile -t web:$TAG --load .
          docker save api:$TAG migrate:$TAG web:$TAG | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar.gz
          retention-days: 7

  staging:
    needs: build
    if: always() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: images
      - name: Push images
        if: github.event_name == 'workflow_run'
        env:
          REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
        run: |
          gunzip -c images.tar.gz | docker load
          for image in api migrate web; do
            docker tag $image:$TAG $REGISTRY/morbeez-staging/$image:$TAG
            docker push $REGISTRY/morbeez-staging/$image:$TAG
          done
      - name: Deploy
        env:
          NAME: morbeez-staging
          CLUSTER: morbeez-staging
          REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
          SUBNETS: ${{ vars.ECS_SUBNETS }}
          SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: bash infrastructure/scripts/deploy.sh

  production:
    needs: [build, staging]
    if: always() && needs.staging.result == 'success'
    runs-on: ubuntu-latest
    # Required reviewers are set on this environment in GitHub: nothing below
    # runs until someone approves the release.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: images
      # The exact images staging ran, not a rebuild.
      - name: Push images
        if: github.event_name == 'workflow_run'
        env:
          REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
        run: |
          gunzip -c images.tar.gz | docker load
          for image in api migrate web; do
            docker tag $image:$TAG $REGISTRY/morbeez-prod/$image:$TAG
            docker push $REGISTRY/morbeez-prod/$image:$TAG
          done
      - name: Deploy
        env:
          NAME: morbeez-prod
          CLUSTER: morbeez-prod
          REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
          SUBNETS: ${{ vars.ECS_SUBNETS }}
          SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: bash infrastructure/scripts/deploy.sh
