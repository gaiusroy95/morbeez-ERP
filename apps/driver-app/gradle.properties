kotlin.code.style=official
android.useAndroidX=true
# Dexing the libraries needs more than Gradle's 512 MB default.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# The hosted preview the `preview` build (assemblePreview) talks to:
# the API on Render and the owner app on Vercel. Debug builds ignore these
# and use the PC the emulator runs on.
morbeez.previewApiUrl=https://morbeez-erp-33ba.onrender.com/
morbeez.previewOwnerUrl=https://morbeez-erp.vercel.app/
