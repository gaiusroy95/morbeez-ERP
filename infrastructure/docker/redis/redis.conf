# Local development only — production runs Amazon ElastiCache with its own
# operator-managed configuration (System Architecture, DB.5).

# Persist between container restarts so dev queue jobs / cached sessions
# survive a laptop reboot, without pretending this is a durable store.
appendonly yes
appendfsync everysec

# Cache + rate-limit + job queue share this instance in dev too, matching
# how it's actually deployed — no reason to fragment it locally.
maxmemory 256mb
maxmemory-policy allkeys-lru
